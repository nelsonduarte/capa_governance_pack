name: CI

# Lightweight CI for the governance-pack CLI. Installs the Capa
# toolchain from the main capa-language repo at a pinned tag, type-
# and format-checks every module, then runs the pipeline against
# the in-repo sample data.
#
# OSV.dev enrichment is intentionally OFF in CI (no
# GOV_PACK_INCLUDE_CVE) so that pushes and PRs do not hit a public
# API from GitHub-hosted runners. The default run is provably
# Net-quiet at the call-site granularity.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Capa toolchain (pinned tag)
        run: |
          python -m pip install --upgrade pip
          # capa-language v1.10.0
          pip install "git+https://github.com/nelsonduarte/capa-language.git@505789a64d86535d2e9e0009f026c43fd79de106"

      - name: Type-check every module
        run: |
          capa --check governance.capa
          capa --check parse.capa
          capa --check evaluate.capa
          capa --check render.capa
          capa --check enrich.capa
          capa --check model.capa

      - name: Format-check entry point
        run: capa --fmt-check governance.capa

      - name: Run pipeline against sample data
        run: capa --run governance.capa
