name: Release

# Triggered by a signed v* tag push. Produces a source tarball,
# generates a SLSA L2 build-provenance attestation through
# Sigstore (keyless OIDC; published to the Rekor transparency
# log via `actions/attest-build-provenance@v4`), and attaches
# both to a new GitHub release.
#
# To verify a downloaded tarball on the consumer side:
#
#   gh attestation verify capa_governance_pack-<tag>.tar.gz --owner nelsonduarte
#
# That confirms the tarball was built by this repo's CI on a tag
# matching the SHA recorded in the Rekor entry.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write       # create release + upload assets
  id-token: write       # Sigstore OIDC for keyless signing
  attestations: write   # publish SLSA provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Verify tag is GPG-signed by the pinned publisher key
        run: |
          set -euo pipefail
          # Anchor on the pinned primary-key fingerprint. A merely
          # "valid" signature is not enough: the tag must be signed by
          # THIS publisher. Any deviation (no key, wrong key, unsigned
          # tag, signature by a different key) fails the release.
          PINNED=6C1D222D491FB88031E041A536CFB426101AA24B
          if [ ! -f publisher.asc ]; then
            echo "::error::publisher.asc is missing; cannot verify the tag signature."
            exit 1
          fi
          gpg --import publisher.asc
          if ! gpg --with-colons --fingerprint \
               | grep -q "^fpr:::::::::${PINNED}:"; then
            echo "::error::publisher.asc does not contain the pinned fingerprint ${PINNED}."
            exit 1
          fi
          SIGNER=$(git verify-tag --raw "${GITHUB_REF_NAME}" 2>&1 \
                   | awk '/^\[GNUPG:\] VALIDSIG/ { print $NF }')
          if [ "${SIGNER}" != "${PINNED}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not signed by the pinned key (got '${SIGNER}', want '${PINNED}')."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} verified against pinned publisher key ${PINNED}."

      - name: Build source tarball
        id: tarball
        run: |
          NAME="${GITHUB_REPOSITORY##*/}-${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="${NAME}/" HEAD > "${NAME}.tar.gz"
          SHA256=$(sha256sum "${NAME}.tar.gz" | cut -d' ' -f1)
          echo "name=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA L2 provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: ${{ steps.tarball.outputs.name }}

      - name: Publish release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          files: ${{ steps.tarball.outputs.name }}
          generate_release_notes: false
          body: |
            First SLSA L2 attested release of `${{ github.event.repository.name }}`.

            **Tarball:** `${{ steps.tarball.outputs.name }}`
            **SHA-256:** `${{ steps.tarball.outputs.sha256 }}`

            ## Verification

            Tag signature (publisher identity):

            ```
            gpg --import publisher.asc
            git verify-tag ${{ github.ref_name }}
            ```

            SLSA L2 build provenance (CI-attested, published to Sigstore Rekor):

            ```
            gh attestation verify ${{ steps.tarball.outputs.name }} \
                --owner ${{ github.repository_owner }}
            ```

            Publisher GPG fingerprint:
            `6C1D222D491FB88031E041A536CFB426101AA24B`

            See `SECURITY.md` for the full provenance model.
